[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wristscribe"
dynamic = ["version"]
description = "Dictate on your Apple Watch; the text appears at your laptop's cursor."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jeyasuriya Ilango" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyperclip>=1.8",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wristscribe = "wristscribe.__main__:main"

[tool.setuptools]
packages = ["wristscribe"]

[tool.setuptools.dynamic]
version = { attr = "wristscribe.__version__" }

[tool.setuptools.package-data]
wristscribe = ["config_template.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
